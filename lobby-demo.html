<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--bg:#150e22;--panel:#241a38;--line:#3a2d52;--txt:#f3ecff;--sub:#a99cc6;--accent:#ff4d72;--gold:#ffd35c}
  body{background:#0c0817;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--txt);display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:44px 26px;flex-wrap:wrap}
  .wrap{position:relative}
  .cap-top{position:absolute;top:-30px;left:0;font-size:14px;color:#b3a7d6;font-weight:800}
  .phone{width:384px;height:812px;background:var(--bg);border-radius:32px;overflow:hidden;position:relative;box-shadow:0 30px 80px -20px #000;border:1px solid #2a2140}
  /* 상단 미니 HUD (한 줄) */
  .top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    background:linear-gradient(180deg,rgba(12,8,23,.75),transparent)}
  .agency{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
  .agency .lg{width:26px;height:26px;border-radius:8px;background:#3a2d52;display:flex;align-items:center;justify-content:center;font-size:15px}
  .coins{display:flex;gap:7px}
  .coin{background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800}
  .coin b{color:var(--gold)}
  /* 캐릭터 히어로 (화면 대부분) */
  .hero{position:absolute;top:0;left:0;right:0;height:66%;background:#000 center/cover no-repeat}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,8,23,.5) 0%,transparent 24%,transparent 52%,rgba(12,8,23,.96) 100%)}
  .trend{position:absolute;top:56px;left:16px;z-index:4;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
  .trend b{color:var(--accent)}
  .heroinfo{position:absolute;left:20px;bottom:0;z-index:4}
  .badge{display:inline-block;font-size:12px;font-weight:800;color:#1a1226;background:var(--gold);padding:3px 11px;border-radius:999px;margin-bottom:9px}
  .gname{font-size:34px;font-weight:900;line-height:1.05;text-shadow:0 3px 16px #000}
  .gsub{margin-top:7px;font-size:14px;color:#e7ddff;font-weight:600;text-shadow:0 2px 8px #000}
  .gsub .tier{color:var(--gold)}
  /* 하단: 큰 주행동 하나 + 보조 */
  .dock{position:absolute;left:0;right:0;bottom:78px;z-index:5;padding:0 18px;display:flex;flex-direction:column;gap:11px}
  .cta{width:100%;padding:19px;border-radius:20px;border:none;font-size:19px;font-weight:900;color:#fff;
    background:linear-gradient(135deg,#ff5f8f,#ff3d68);box-shadow:0 12px 30px -8px rgba(255,61,104,.7),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer}
  .subrow{display:flex;gap:10px}
  .sbtn{flex:1;padding:14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--txt);font-size:14px;font-weight:800;cursor:pointer}
  /* 탭바 */
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:70px;z-index:6;background:rgba(18,12,30,.94);backdrop-filter:blur(10px);border-top:1px solid #2a2140;display:flex}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#7d7099;font-weight:700}
  .tab.on{color:#fff}
  .tab.on .ti{filter:drop-shadow(0 0 6px var(--accent))}
  .tab .ti{font-size:21px}
  .cap-bot{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-size:12px;color:#6a5f88}

  /* 신규 유저 로비 (거의 빈 화면) */
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:2px;
    background:radial-gradient(120% 80% at 50% 30%,rgba(255,120,180,.16),transparent 60%)}
  .empty .mas{font-size:64px;margin-bottom:6px}
  .empty h1{font-size:23px;font-weight:900;line-height:1.3}
  .empty p{font-size:14px;color:var(--sub);margin-top:10px;line-height:1.5}
  .empty .cta{margin-top:26px;width:100%}
</style></head><body>

<!-- ===== A. 신규 유저: 첫 진입 로비 ===== -->
<div class="wrap">
  <div class="cap-top">A · 신규 유저 첫 진입</div>
  <div class="phone">
    <div class="empty">
      <div class="mas">🐤🐰</div>
      <h1>신생 기획사에<br>온 걸 환영해요!</h1>
      <p>원석을 발굴해 스타로 키우는<br><b style="color:var(--txt)">프로듀서</b>가 되어보세요.</p>
      <button class="cta">✨ 첫 아이돌 키우러 가기</button>
    </div>
    <div class="tabbar">
      <div class="tab on"><span class="ti">🏠</span>홈</div>
      <div class="tab"><span class="ti">🛏️</span>숙소</div>
      <div class="tab"><span class="ti">🎴</span>카드</div>
      <div class="tab"><span class="ti">🏆</span>차트</div>
      <div class="tab"><span class="ti">☰</span>메뉴</div>
    </div>
  </div>
  <div class="cap-bot">버튼 하나. 첫 판 끝나야 숙소·카드·차트가 열림</div>
</div>

<!-- ===== B. 복귀 유저: 대표 그룹 로비 ===== -->
<div class="wrap">
  <div class="cap-top">B · 복귀 유저 (대표 그룹 있음)</div>
  <div class="phone">
    <div class="hero" style="background-image:url('https://dcyuonzxltfl2140514.gcdn.ntruss.com/faces/20260726/556/55617c84b7e0d62284eef8862e28eaf26a8c18a88db29cc2ad53bb8a1afaac565a57_o_st.webp')"></div>
    <div class="top">
      <div class="agency"><span class="lg">🏢</span>스타라이트</div>
      <div class="coins"><span class="coin">💎 <b>12</b></span><span class="coin">🎤 <b>5</b></span></div>
    </div>
    <div class="trend">🎧 이번 트렌드 <b>자컨 붐</b> · D-3</div>
    <div class="heroinfo">
      <span class="badge">🏆 우리 대표 그룹</span>
      <div class="gname">네온플래시</div>
      <div class="gsub"><span class="tier">🥈 실버</span> · 승점 138P · 4인</div>
    </div>
    <div class="dock">
      <button class="cta">⚔️ 무대 대결하러 가기</button>
      <div class="subrow">
        <button class="sbtn">✨ 육성</button>
        <button class="sbtn">📸 그룹 정보</button>
      </div>
    </div>
    <div class="tabbar">
      <div class="tab on"><span class="ti">🏠</span>홈</div>
      <div class="tab"><span class="ti">🛏️</span>숙소</div>
      <div class="tab"><span class="ti">🎴</span>카드</div>
      <div class="tab"><span class="ti">🏆</span>차트</div>
      <div class="tab"><span class="ti">☰</span>메뉴</div>
    </div>
  </div>
  <div class="cap-bot">그룹이 화면 주인공 · 주행동 하나 크게 · 편성/재화/시즌은 최소화</div>
</div>

</body></html>
