<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>육성 로그라이트 프로토 — 매 턴 선택이 재미</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--gold:#ffd35c;--accent:#ff4d72;--bg:#0b0618;--panel:#1a1030;--line:#2c1f4a;--txt:#f3ecff;--sub:#a99cc9;
    --voc:#ff6a9a;--dan:#5fc9ff;--vis:#c99bff}
  body{background:radial-gradient(120% 60% at 50% -5%,#231540,#0b0618 60%);font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--txt);min-height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:440px;min-height:100vh;padding:14px 14px 28px;position:relative;overflow:hidden}
  .cap{font-size:11.5px;color:var(--sub);text-align:center;margin-bottom:10px;font-weight:700}
  .cap b{color:var(--gold)}

  /* 상단 상태 HUD */
  .hud{background:linear-gradient(135deg,var(--panel),#150c28);border:1px solid var(--line);border-radius:16px;padding:12px 13px}
  .hud-top{display:flex;align-items:center;gap:11px}
  .por{width:52px;height:66px;border-radius:11px;flex:none;background:#2a2040 center 20%/cover no-repeat;box-shadow:0 0 0 2px var(--gold),0 6px 14px -6px #000}
  .hud-id{flex:1;min-width:0}
  .hud-nm{font-size:16px;font-weight:900}
  .hud-week{font-size:11.5px;color:var(--sub);font-weight:700;margin-top:2px}
  .cond{text-align:center;flex:none}
  .cond .cf{font-size:26px;line-height:1}
  .cond .ct{font-size:10px;font-weight:800;margin-top:1px}
  .cond.good .ct{color:#4fd6a0}.cond.bad .ct{color:#ff7a7a}.cond.norm .ct{color:var(--sub)}
  .stam{margin-top:11px}
  .stam-lab{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--sub);margin-bottom:4px}
  .stam-lab b{color:#7fd6ff}
  .bar{height:9px;background:#0e0820;border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.3,1.1,.4,1)}
  .stam .bar>i{background:linear-gradient(90deg,#5fc9ff,#4a8fe0)}

  .stats{display:grid;grid-template-columns:1fr;gap:8px;margin-top:11px}
  .st{display:flex;align-items:center;gap:9px}
  .st-nm{width:46px;font-size:12px;font-weight:800;flex:none}
  .st .bar{flex:1}
  .st .bar>i{transition:width .6s cubic-bezier(.3,1.4,.4,1)}
  .st-v{width:60px;text-align:right;font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums}
  .st.voc .st-nm{color:var(--voc)} .st.voc .bar>i{background:linear-gradient(90deg,#ff8ab0,#ff4d72)}
  .st.dan .st-nm{color:var(--dan)} .st.dan .bar>i{background:linear-gradient(90deg,#7fd6ff,#3a8fe0)}
  .st.vis .st-nm{color:var(--vis)} .st.vis .bar>i{background:linear-gradient(90deg,#d3a5ff,#9a5cf0)}
  .st.hot{position:relative}
  .st.hot .st-nm::after{content:"🔥";font-size:11px;margin-left:2px}
  .st .gain{color:#4fd6a0;font-weight:900;margin-left:5px;opacity:0;font-size:12px}
  .st .gain.show{animation:gpop 1.1s ease both}
  @keyframes gpop{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

  .trend{margin-top:11px;background:rgba(255,211,92,.1);border:1px solid #4a3a1a;border-radius:11px;padding:8px 12px;font-size:12px;font-weight:700;line-height:1.55}
  .trend b{color:var(--gold)}

  .ask{text-align:center;font-size:15px;font-weight:900;margin:16px 0 11px}
  .ask small{display:block;font-size:11.5px;color:var(--sub);font-weight:700;margin-top:3px}

  /* 카드(행동 선택) */
  .cards{display:flex;flex-direction:column;gap:10px}
  .card{position:relative;text-align:left;border:1.5px solid var(--line);border-radius:15px;padding:13px 14px;cursor:pointer;
    background:linear-gradient(135deg,#1d1236,#170e2b);transition:transform .12s,border-color .12s;overflow:hidden}
  .card:active{transform:scale(.98)}
  .card.disabled{opacity:.42;pointer-events:none;filter:grayscale(.5)}
  .card.rare{border-color:var(--gold);background:linear-gradient(135deg,#2a2140,#1e1636);box-shadow:0 0 20px -6px rgba(255,211,92,.5)}
  .card.rare::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.14) 49%,transparent 56%);background-size:250% 100%;animation:cshine 3.2s ease-in-out infinite;pointer-events:none}
  @keyframes cshine{0%,60%{background-position:180% 0}100%{background-position:-120% 0}}
  .c-top{display:flex;align-items:center;gap:8px}
  .c-ic{font-size:22px;flex:none}
  .c-nm{font-size:14.5px;font-weight:900;flex:1}
  .c-cost{font-size:11.5px;font-weight:800;color:#7fd6ff;flex:none}
  .c-cost.no{color:#ff7a7a}
  .c-desc{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.4}
  .c-desc em{color:var(--txt);font-style:normal;font-weight:800}
  .c-tag{position:absolute;top:9px;right:11px;font-size:9px;font-weight:900;color:var(--gold);letter-spacing:.5px}

  /* 이벤트/결과 오버레이 */
  .ov{position:fixed;inset:0;background:rgba(6,3,16,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
  .ov.on{display:flex}
  .sheet{width:100%;max-width:380px;background:linear-gradient(160deg,#221540,#160d2b);border:1px solid var(--line);border-radius:22px;padding:20px 18px;text-align:center;animation:sIn .32s cubic-bezier(.3,1.3,.5,1) both}
  @keyframes sIn{0%{opacity:0;transform:translateY(16px) scale(.96)}100%{opacity:1;transform:none}}
  .sheet .em{font-size:44px;line-height:1}
  .sheet h3{font-size:18px;font-weight:900;margin:8px 0 6px}
  .sheet p{font-size:13px;color:var(--sub);line-height:1.55}
  .sheet p em{color:var(--txt);font-style:normal;font-weight:800}
  .opt{display:flex;flex-direction:column;gap:9px;margin-top:15px}
  .btn{border:none;border-radius:14px;padding:14px;font-size:14.5px;font-weight:900;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#ff5f8f,#ff3d68);box-shadow:0 10px 22px -8px rgba(255,61,104,.6)}
  .btn.ghost{background:#221a3a;border:1px solid var(--line);color:var(--txt);box-shadow:none}
  .btn small{display:block;font-size:11px;font-weight:700;opacity:.85;margin-top:2px}

  /* 오디션 리빌 */
  .aud-gauge{height:22px;border-radius:12px;background:#0e0820;overflow:hidden;margin:14px 0 6px;position:relative}
  .aud-gauge>i{display:block;height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,var(--voc),var(--gold));transition:width 1.6s cubic-bezier(.4,1.05,.4,1)}
  .aud-line{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;box-shadow:0 0 8px #fff;z-index:2}
  .grade{font-size:60px;font-weight:900;line-height:1;margin:6px 0}
  .grade.s{color:var(--gold);text-shadow:0 0 24px rgba(255,211,92,.7)}
  .grade.a{color:#ff9bd0}.grade.b{color:#9bd0ff}.grade.c{color:var(--sub)}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(20,12,38,.96);border:1px solid var(--line);
    color:var(--txt);font-size:13px;font-weight:800;padding:10px 16px;border-radius:999px;z-index:30;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px -8px #000}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
</style></head>
<body><div class="app" id="app"></div>
<div class="ov" id="ov"></div>
<div class="toast" id="toast"></div>
<script>
// ─────────────────────────────────────────────────────────────
// 육성 로그라이트 프로토 — "매 턴 선택 + 랜덤 + 긴장"이 재미를 만든다(학마스 에센스 축약)
// 라이브 게임 미포함. 방향 증명용.
// ─────────────────────────────────────────────────────────────
const FACE='https://dcyuonzxltfl2140514.gcdn.ntruss.com/faces/20260726/556/55617c84b7e0d62284eef8862e28eaf26a8c18a88db29cc2ad53bb8a1afaac565a57_o_st.webp';
const TREND={key:'voc', nm:'보컬 대세', ic:'🎤'};   // 이번 시즌 트렌드(맞는 스탯 육성 시 보너스)
const WEEKS=8, GOAL=560;   // 오디션 합격선(트렌드 스탯 기준)
const STN={voc:'보컬',dan:'댄스',vis:'비주얼'};

const CONDS={
  good:{cf:'🤩',ct:'好調',mult:1.5},
  norm:{cf:'🙂',ct:'보통',mult:1.0},
  bad :{cf:'😵',ct:'부진',mult:0.6},
};
// 행동 카드 풀 — 매 턴 3장 뽑아 그 중 1개 선택(덱빌딩의 축약: 선택+랜덤 드로우)
const POOL=[
  {id:'voc1', ic:'🎤', nm:'보컬 레슨',   stat:'voc', base:46, cost:28, desc:'보컬 <em>+큰폭</em>'},
  {id:'dan1', ic:'💃', nm:'안무 연습',   stat:'dan', base:46, cost:28, desc:'댄스 <em>+큰폭</em>'},
  {id:'vis1', ic:'✨', nm:'비주얼 케어', stat:'vis', base:46, cost:26, desc:'비주얼 <em>+큰폭</em>'},
  {id:'voc2', ic:'🎧', nm:'가벼운 발성', stat:'voc', base:24, cost:12, desc:'보컬 <em>+조금</em> · 기력 <em>적게</em>'},
  {id:'dan2', ic:'🩰', nm:'스트레칭',   stat:'dan', base:24, cost:12, desc:'댄스 <em>+조금</em> · 기력 <em>적게</em>'},
  {id:'rest', ic:'🛌', nm:'휴식',       stat:null,  base:0,  cost:-42, desc:'기력 <em>회복</em> + 컨디션 <em>↑</em>'},
  {id:'live', ic:'📺', nm:'라이브 출연', stat:'fan', base:0,  cost:20, desc:'팬 <em>대폭↑</em> · 스탯 소폭(랜덤)'},
];
const RARE={id:'star', ic:'🌟', nm:'스페셜 레슨', rare:true, cost:20, desc:'<em>트렌드 스탯 폭발</em> + 컨디션 好調'};

const S={};
function reset(){
  S.week=1; S.stam=100; S.cond='norm';
  S.stats={voc:120,dan:120,vis:120}; S.fan=0;
  S.hand=[]; S.log=[]; S.eventSeen=0;
  draw();
}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function draw(){
  // 3장 드로우: 중복 없이, 낮은 확률로 레어 등장(좋은 카드 뽑는 손맛)
  const p=POOL.slice(); const h=[];
  // 항상 휴식은 기력 낮으면 강제 포함
  while(h.length<3 && p.length){ const i=Math.floor(Math.random()*p.length); h.push(p.splice(i,1)[0]); }
  if(Math.random()<0.22) h[Math.floor(Math.random()*h.length)]=RARE;   // 22% 레어 뜸
  if(S.stam<28 && !h.find(c=>c.id==='rest')) h[2]=POOL.find(c=>c.id==='rest');
  S.hand=h;
}
function rollCond(){
  const r=Math.random();
  S.cond = r<0.22?'good' : r<0.78?'norm' : 'bad';
}

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1700); }

function render(){
  const c=CONDS[S.cond];
  const app=document.getElementById('app');
  const stBar=(k)=>{ const v=S.stats[k], pct=Math.min(100,v/7); const hot=k===TREND.key;
    return `<div class="st ${k}${hot?' hot':''}"><span class="st-nm">${STN[k]}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span class="st-v" id="stv-${k}">${v}<span class="gain" id="g-${k}"></span></span></div>`; };
  app.innerHTML=`
    <div class="cap">🧪 육성 <b>로그라이트</b> 프로토 · 매 턴 <b>선택</b>이 판을 바꾼다 (학마스식)</div>
    <div class="hud">
      <div class="hud-top">
        <span class="por" style="background-image:url('${FACE}')"></span>
        <div class="hud-id"><div class="hud-nm">셔누 <span style="font-size:11px;color:var(--sub);font-weight:700">· 데뷔 준비생</span></div>
          <div class="hud-week">${S.week<=WEEKS?`${S.week}주차 / ${WEEKS}주 · 오디션까지 <b style="color:var(--gold)">${WEEKS-S.week+1}주</b>`:'오디션'}</div></div>
        <div class="cond ${S.cond}"><div class="cf">${c.cf}</div><div class="ct">${c.ct}</div></div>
      </div>
      <div class="stam"><div class="stam-lab"><span>⚡ 기력</span><b>${S.stam}/100</b></div>
        <div class="bar"><i style="width:${S.stam}%"></i></div></div>
      <div class="stats">${stBar('voc')}${stBar('dan')}${stBar('vis')}</div>
      <div class="trend">${TREND.ic} 트렌드 <b>${TREND.nm}</b> · ${STN[TREND.key]} 훈련 <b>+30%</b> · 합격선 <b>${GOAL}</b></div>
    </div>
    <div class="ask">이번 주, 뭐 할까?<small>기력·컨디션·트렌드를 재서 한 장 고르세요 (선택마다 결과가 달라져요)</small></div>
    <div class="cards">${S.hand.map((card,i)=>{
      const noStam = card.cost>0 && S.stam<card.cost;
      return `<div class="card${card.rare?' rare':''}${noStam?' disabled':''}" onclick="pick(${i})">
        ${card.rare?'<span class="c-tag">RARE ✦</span>':''}
        <div class="c-top"><span class="c-ic">${card.ic}</span><span class="c-nm">${card.nm}</span>
          <span class="c-cost ${noStam?'no':''}">${card.cost>0?`기력 -${card.cost}`:card.cost<0?`기력 +${-card.cost}`:'기력 -20'}</span></div>
        <div class="c-desc">${card.desc}${card.stat && card.stat===TREND.key?' · <em style="color:var(--gold)">🔥트렌드!</em>':''}</div>
      </div>`; }).join('')}</div>`;
}

function pick(i){
  const card=S.hand[i];
  const c=CONDS[S.cond], mult=c.mult;
  let msg='';
  if(card.id==='rest'){
    S.stam=Math.min(100,S.stam+42);
    if(S.cond!=='good'){ S.cond = S.cond==='bad'?'norm':'good'; }
    msg='푹 쉬었다 — 기력 회복 + 컨디션 ↑';
  } else if(card.id==='live'){
    S.stam-=20; const fan=140+Math.floor(Math.random()*120); S.fan+=fan;
    const k=rnd(['voc','dan','vis']); const g=Math.round(14*mult); S.stats[k]+=g;
    flashGain(k,g); msg=`무대 성공! 팬 +${fan} · ${STN[k]} +${g}`;
  } else if(card.rare){
    S.stam-=card.cost; const k=TREND.key; const g=Math.round(78*mult);
    S.stats[k]+=g; S.cond='good'; flashGain(k,g); msg=`✨ 대박 레슨! ${STN[k]} +${g} · 컨디션 好調!`;
  } else {
    S.stam-=card.cost;
    let g=Math.round(card.base*mult);
    if(card.stat===TREND.key) g=Math.round(g*1.3);   // 트렌드 보너스
    S.stats[card.stat]+=g; flashGain(card.stat,g);
    msg=`${card.nm} — ${STN[card.stat]} +${g}${card.stat===TREND.key?' (🔥트렌드!)':''}${S.cond==='good'?' · 好調 대성공!':S.cond==='bad'?' · 부진…':''}`;
  }
  toast(msg);
  S.week++;
  rollCond();
  // 다음 주 진행 or 오디션
  setTimeout(()=>{
    if(S.week>WEEKS){ audition(); return; }
    // 랜덤 이벤트(선택형 딜레마) — 판당 1~2회
    if(S.eventSeen<2 && Math.random()<0.42){ S.eventSeen++; showEvent(); }
    else { draw(); render(); }
  }, 720);
}
function card_base(){return 0;}
function flashGain(k,g){
  render();
  const el=document.getElementById('g-'+k); if(el){ el.textContent='+'+g; el.classList.add('show'); }
}

// 선택형 랜덤 이벤트 — 진짜 딜레마(트레이드오프)
const EVENTS=[
  {em:'🌙', h:'밤샘 연습?', p:'"조금만 더 하면 완벽할 것 같아요…"',
   a:{t:'밤샘 강행', s:'트렌드 스탯 크게↑ · 기력 폭락', run:()=>{const k=TREND.key,g=64;S.stats[k]+=g;S.stam=Math.max(0,S.stam-40);toast(`밤샘! ${STN[k]} +${g} · 기력 폭락`);}},
   b:{t:'재우고 내일', s:'기력 회복 · 컨디션↑', run:()=>{S.stam=Math.min(100,S.stam+26);S.cond='good';toast('푹 재웠다 — 컨디션 好調');}}},
  {em:'🎬', h:'예능 섭외가 왔다', p:'"나가면 팬은 늘겠지만 연습 시간이 줄어요."',
   a:{t:'출연한다', s:'팬 대폭↑ · 이번 주 훈련 스킵', run:()=>{const f=260;S.fan+=f;toast(`예능 출연! 팬 +${f}`);}},
   b:{t:'연습에 집중', s:'전 스탯 소폭↑', run:()=>{['voc','dan','vis'].forEach(k=>S.stats[k]+=16);toast('전 스탯 +16');}}},
  {em:'🤕', h:'컨디션 난조', p:'"몸이 좀 무거워요… 무리하면 탈 날 것 같아요."',
   a:{t:'약 먹고 강행', s:'컨디션 회복 · 기력 소모', run:()=>{S.cond='norm';S.stam=Math.max(0,S.stam-14);toast('겨우 추슬렀다');}},
   b:{t:'하루 통째로 휴식', s:'기력 대폭 회복', run:()=>{S.stam=Math.min(100,S.stam+50);toast('기력 대폭 회복 +50');}}},
  {em:'💡', h:'멘토의 조언', p:'"네 강점을 하나만 확실히 밀어봐."',
   a:{t:'트렌드 스탯 몰빵', s:`${STN[TREND.key]} 크게↑`, run:()=>{const k=TREND.key,g=52;S.stats[k]+=g;toast(`${STN[k]} +${g}`);}},
   b:{t:'약점 보완', s:'가장 낮은 스탯↑', run:()=>{let lo='voc';['dan','vis'].forEach(k=>{if(S.stats[k]<S.stats[lo])lo=k;});S.stats[lo]+=44;toast(`${STN[lo]} +44`);}}},
];
function showEvent(){
  const ev=rnd(EVENTS);
  const ov=document.getElementById('ov'); ov.className='ov on';
  ov.innerHTML=`<div class="sheet"><div class="em">${ev.em}</div><h3>${ev.h}</h3><p>${ev.p}</p>
    <div class="opt">
      <button class="btn" onclick="evPick('a')">${ev.a.t}<small>${ev.a.s}</small></button>
      <button class="btn ghost" onclick="evPick('b')">${ev.b.t}<small>${ev.b.s}</small></button>
    </div></div>`;
  S._ev=ev;
}
function evPick(k){
  S._ev[k].run();
  document.getElementById('ov').className='ov';
  setTimeout(()=>{ draw(); render(); }, 260);
}

// 오디션 — 트렌드 스탯 기준 스킬체크 + 조마조마 게이지 리빌
function audition(){
  const score=S.stats[TREND.key];
  const total=S.stats.voc+S.stats.dan+S.stats.vis;
  const pct=Math.min(100, Math.round(score/GOAL*100));
  const pass=score>=GOAL;
  let grade,gcls;
  if(score>=GOAL*1.25){grade='S';gcls='s';}
  else if(score>=GOAL){grade='A';gcls='a';}
  else if(score>=GOAL*0.8){grade='B';gcls='b';}
  else {grade='C';gcls='c';}
  const ov=document.getElementById('ov'); ov.className='ov on';
  ov.innerHTML=`<div class="sheet"><div class="em">🎤</div><h3>데뷔 오디션</h3>
    <p>이번 시즌 트렌드 <em>${TREND.nm}</em> 기준 심사 중…</p>
    <div class="aud-gauge"><i id="augi"></i><span class="aud-line" style="left:${Math.min(100,GOAL/GOAL*100)}%"></span></div>
    <p style="font-size:11.5px">합격선 <em>${GOAL}</em> · 내 ${STN[TREND.key]} <em>${score}</em></p>
    <div id="audres" style="opacity:0;transition:opacity .4s"></div></div>`;
  setTimeout(()=>{ document.getElementById('augi').style.width=pct+'%'; },120);
  setTimeout(()=>{
    const r=document.getElementById('audres'); r.style.opacity=1;
    r.innerHTML=`<div class="grade ${gcls}">${grade}</div>
      <h3 style="margin-top:0">${pass?'데뷔 확정! 🎉':'아쉽게 탈락…'}</h3>
      <p>${pass?'트렌드에 맞춰 잘 키웠어요. 팬 '+S.fan+'명 확보!':'합격선에 조금 못 미쳤어요. 트렌드 스탯을 더 밀어봐요.'}<br>
        <span style="font-size:11.5px">보컬 ${S.stats.voc} · 댄스 ${S.stats.dan} · 비주얼 ${S.stats.vis} · 팬 ${S.fan}</span></p>
      <div class="opt"><button class="btn" onclick="restart()">다시 육성 (매판 달라져요) 🔄</button></div>`;
  }, 1900);
}
function restart(){ document.getElementById('ov').className='ov'; reset(); render(); }

reset(); render();
</script>
</body></html>
